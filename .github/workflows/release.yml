name: Release

on:
  push:
    branches: [master]
    paths-ignore:
      - "CHANGELOG.md"
      - "VERSION"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: kenji-miyake/setup-git-cliff@v2

      - name: Determine next version
        id: version
        run: |
          # stderr has warnings, stdout has the version
          NEXT_VERSION=$(git cliff --bumped-version 2>/dev/null) || true
          echo "git-cliff output: [$NEXT_VERSION]"

          # Skip if empty or not a valid version tag
          if [[ -z "$NEXT_VERSION" || ! "$NEXT_VERSION" =~ ^v[0-9] ]]; then
            echo "No version bump needed. Skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Skip if this tag already exists (no new releasable commits)
          if git rev-parse "$NEXT_VERSION" >/dev/null 2>&1; then
            echo "Tag $NEXT_VERSION already exists. Skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Will release $NEXT_VERSION"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        if: steps.version.outputs.skip == 'false'
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --strip all --tag ${{ steps.version.outputs.version }}

      - name: Write VERSION
        if: steps.version.outputs.skip == 'false'
        run: echo "${{ steps.version.outputs.version }}" > VERSION

      - name: Generate full changelog
        if: steps.version.outputs.skip == 'false'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --output CHANGELOG.md

      - name: Commit release files
        if: steps.version.outputs.skip == 'false'
        id: release_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md VERSION
          if git diff --staged --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "🔧 chore(release): update CHANGELOG.md for ${{ steps.version.outputs.version }}"
          git push origin master
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: steps.version.outputs.skip == 'false'
        run: |
          git tag "${{ steps.version.outputs.version }}" "${{ steps.release_commit.outputs.sha }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        if: steps.version.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.content }}
